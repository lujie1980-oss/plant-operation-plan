%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=classpath:db/migration,classpath:db/test-migration
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.http.test-port=8888
plantops.sample-data.enabled=false

# IAM — required by IamSecurityConfig @ConfigMapping (ADR-13)
plantops.security.dev-mode=true
plantops.security.registration-enabled=false
plantops.security.local-login-enabled=true
plantops.security.jwt.secret=plantops-test-jwt-secret-key-min-32-chars!!
plantops.security.jwt.issuer=plantops
plantops.security.jwt.ttl-hours=24
# OIDC live tests (OidcLiveIntegrationTest) — dual-verify with local JWT (IamAcTest)
plantops.security.oidc.enabled=true
plantops.security.oidc.auth-server-url=http://localhost:8081/realms/plantops
plantops.security.oidc.client-id=plantops-ui
plantops.security.oidc.client-secret=plantops-ui-secret
plantops.security.oidc.username-claim=preferred_username
