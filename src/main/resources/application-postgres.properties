# PostgreSQL dev profile — ontology persistence (TODO-12)
# Start: QUARKUS_PROFILE=postgres  (after .\tools\start-postgres-dev.ps1)
#
# Note: legacy Flyway V1–V64 uses H2 syntax (AUTO_INCREMENT, CLOB).
# Full app migrate on PG is tracked separately; new ont_* DDL goes to db/migration-postgresql/.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/plantops}
quarkus.datasource.username=${DB_USER:plantops}
quarkus.datasource.password=${DB_PASSWORD:plantops}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2

# Ontology migrations only (PG-native). Legacy V1–V64 stay on H2 until ported.
quarkus.flyway.locations=classpath:db/migration-postgresql

# Legacy V1–V64 tables absent on PG-only profile; skip workspace/sample bootstraps.
plantops.legacy-schema.enabled=false
plantops.sample-data.enabled=false

# Session simulate/optimize/confirm → ont_* DRAFT + WAL (TODO-12 P2/P3)
plantops.ontology.persistence.session-enabled=true

# P4 migration: legacy work_order dual-write + restorer read overlay
plantops.ontology.persistence.dual-write-enabled=true
plantops.ontology.persistence.restorer-read-enabled=true
plantops.ontology.persistence.bootstrap-head-enabled=true
