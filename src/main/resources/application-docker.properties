# Docker / docker-compose 默认 profile
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# H2 文件库，数据目录挂载到 /app/data
quarkus.datasource.jdbc.url=jdbc:h2:file:/app/data/plantops;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE

# 一体部署无需 CORS
quarkus.http.cors=false

# 生产容器默认不自动灌演示数据（可通过环境变量覆盖）
plantops.sample-data.enabled=false
