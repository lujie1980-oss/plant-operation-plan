# Production profile — PostgreSQL + hardened IAM (stack with application.properties %prod.*)

quarkus.http.host=0.0.0.0
quarkus.http.cors=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:30}
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN:2}

quarkus.flyway.locations=classpath:db/migration-postgresql

plantops.sample-data.enabled=false
