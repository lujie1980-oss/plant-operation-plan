quarkus.application.name=plant-operation-plan
quarkus.http.port=8080

# 前端开发服务器 (Vite 5173) 跨域
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-workspace-id

quarkus.datasource.db-kind=h2
# 默认使用本地文件库，保证策略/运行版本在重启后不丢失
# - 数据文件位于项目目录下的 ./data/plantops.*
# - AUTO_SERVER=TRUE 允许多进程连接（开发时更稳）
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/plantops;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=30S

# 测试环境仍使用内存库（更快且互不污染）
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:plantops-test;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.jdbc.statement-batch-size=50
# 大批量 Excel 导入（如 7 万行 BOM）
quarkus.transaction-manager.default-transaction-timeout=3600

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Plant Operation Plan API
quarkus.smallrye-openapi.info-version=1.0

# 避免 quarkus:dev 首次启动时等待交互式 analytics 提示，确保可无人值守启动
quarkus.analytics.disabled=true

# 默认 workspace 不再灌入其它演示 JSON；仅使用晶华 workspace 种子（WorkspaceSeedService）
plantops.sample-data.enabled=false

# TODO-12 P4/P2：H2 dev 启用 ont_* 切读 + legacy 双写 + WORKSPACE HEAD 引导 + Session 写 ont_*
plantops.ontology.persistence.bootstrap-head-enabled=true
plantops.ontology.persistence.restorer-read-enabled=true
plantops.ontology.persistence.dual-write-enabled=true
plantops.ontology.persistence.session-enabled=true
plantops.sample-data.resource=sample-data/factory-jinghua-demo.json

# 设为 true 时下次启动会清空并重新加载 plantops.sample-data.resource（加载后请改回 false）
plantops.sample-data.force-reload=false

# IAM M3 — local JWT + dev-mode（M4 关闭 dev-mode / 接 IdP）
plantops.security.dev-mode=true
plantops.security.registration-enabled=false
plantops.security.local-login-enabled=true
plantops.security.jwt.secret=${JWT_SECRET:plantops-dev-jwt-secret-key-min-32-chars!!}
plantops.security.jwt.issuer=plantops
plantops.security.jwt.ttl-hours=24

# IAM M4 — OIDC（默认关闭；生产通过环境变量启用）
plantops.security.oidc.enabled=false
plantops.security.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/plantops}
plantops.security.oidc.client-id=${OIDC_CLIENT_ID:plantops-ui}
plantops.security.oidc.client-secret=${OIDC_CLIENT_SECRET:plantops-ui-secret}
plantops.security.oidc.username-claim=preferred_username

# 生产 profile：关闭 dev-mode，JWT/OIDC 由环境变量注入
%prod.plantops.security.dev-mode=false
%prod.plantops.security.local-login-enabled=${LOCAL_LOGIN_ENABLED:false}
%prod.plantops.security.jwt.secret=${JWT_SECRET}
%prod.plantops.security.oidc.enabled=${OIDC_ENABLED:false}
