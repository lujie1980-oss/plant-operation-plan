quarkus.application.name=plant-operation-plan
quarkus.http.port=8080

# 前端开发服务器 (Vite 5173) 跨域
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-workspace-id

quarkus.datasource.db-kind=h2
# 默认使用本地文件库，保证策略/运行版本在重启后不丢失
# - 数据文件位于项目目录下的 ./data/plantops.*
# - AUTO_SERVER=TRUE 允许多进程连接（开发时更稳）
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/plantops;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=30S

# 测试环境仍使用内存库（更快且互不污染）
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:plantops-test;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.jdbc.statement-batch-size=50
# 大批量 Excel 导入（如 7 万行 BOM）
quarkus.transaction-manager.default-transaction-timeout=3600

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Plant Operation Plan API
quarkus.smallrye-openapi.info-version=1.0

# 避免 quarkus:dev 首次启动时等待交互式 analytics 提示，确保可无人值守启动
quarkus.analytics.disabled=true

plantops.sample-data.enabled=true
# 演示数据加载文件（classpath 路径）。可选:
# - sample-data/factory-demo.json
# - sample-data/factory-dunan-demo-lite.json
# - sample-data/factory-dunan-demo.json
plantops.sample-data.resource=sample-data/factory-dunan-demo-lite.json

# 设为 true 时下次启动会清空并重新加载 plantops.sample-data.resource（加载后请改回 false）
plantops.sample-data.force-reload=false
