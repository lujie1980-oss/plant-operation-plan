services:
  plantops:
    build:
      context: .
      dockerfile: Dockerfile
    image: plant-operation-plan:latest
    container_name: plant-operation-plan
    ports:
      - "8080:8080"
    environment:
      QUARKUS_PROFILE: docker
      # 首次体验可改为 true；正式环境保持 false
      PLANTOPS_SAMPLE_DATA_ENABLED: "false"
      # 可选：增大求解可用内存（示例 4g）
      # JAVA_OPTS: "-Xms512m -Xmx4g -XX:MaxRAMPercentage=75.0"
    volumes:
      - plantops-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/q/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  plantops-data:
